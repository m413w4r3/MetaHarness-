<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bridge Lab</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">MetaHarness / Bridges</p>
        <h1>Bridge Lab</h1>
        <p>Diagnostiquer les transports, surfaces API, réponses brutes et métadonnées provider.</p>
      </div>
      <button id="refreshStatus">Actualiser les statuts</button>
    </header>

    <section class="status-grid">
      <article class="card">
        <div class="card-head"><h2>ChatGPT Bridge</h2><span id="bridgeBadge" class="badge">…</span></div>
        <pre id="bridgeStatus">Chargement…</pre>
      </article>
      <article class="card">
        <div class="card-head"><h2>WebAI-to-API</h2><span id="webaiBadge" class="badge">…</span></div>
        <pre id="webaiStatus">Chargement…</pre>
      </article>
    </section>

    <section class="card">
      <div class="toolbar">
        <label>Provider
          <select id="provider">
            <option value="bridge">ChatGPT Bridge</option>
            <option value="webai">WebAI-to-API</option>
          </select>
        </label>
        <label>Surface
          <select id="surface"></select>
        </label>
        <label id="modelLabel">API model label
          <input id="model" list="modelSuggestions" autocomplete="off" spellcheck="false">
          <datalist id="modelSuggestions"></datalist>
          <small id="modelNote"></small>
        </label>
        <label id="uiModelField">UI model (optionnel)
          <input id="uiModel" autocomplete="off" spellcheck="false" placeholder="laissé inchangé">
        </label>
        <label>Idempotency key
          <input id="idem" placeholder="optionnel">
        </label>
      </div>

      <p id="surfaceHint" class="hint"></p>

      <div class="presets">
        <button data-preset="text">Requête texte</button>
        <button data-preset="stream">SSE buffered</button>
        <button data-preset="background" data-bridge-only>Responses background</button>
        <button data-preset="native" data-bridge-only>Bridge natif /runs</button>
      </div>

      <label class="block">Payload API
        <textarea id="payload" spellcheck="false"></textarea>
      </label>

      <div class="actions">
        <button id="send" class="primary">Envoyer</button>
        <button id="stopPolling" disabled>Stop polling</button>
        <span id="requestState"></span>
      </div>
    </section>

    <section class="result-grid">
      <article class="card">
        <h2>Diagnostic</h2>
        <div id="diagnostic" class="diagnostic empty">Aucun test.</div>
      </article>
      <article class="card">
        <h2>Texte extrait</h2>
        <pre id="extracted">—</pre>
      </article>
    </section>

    <section class="card">
      <h2>Réponse brute</h2>
      <pre id="raw">—</pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
