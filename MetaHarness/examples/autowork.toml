# Relative paths are resolved from this file's directory (MetaHarness/examples/).
repo = "../../AutoWork"
base_ref = "main"

runs_root = "../../MetaHarness-runs"
worktrees_root = "../../MetaHarness-worktrees"
require_clean_base = true
max_diff_bytes = 2000000
allow_no_required_checks = false
default_check_ids = ["lint", "typecheck", "test"]

[planning]
protocol = "v2"
decomposition = "aggressive"
execution_mode_policy = "auto"
max_preapproval_corrections = 2

single_step_max_mutable_paths = 6
staged_step_max_mutable_paths = 12
max_steps_per_plan = 21
max_read_paths_per_step = 18
max_step_contract_chars = 8500


[revision]
enabled = true
max_check_repair_attempts = 2
max_review_repair_cycles = 2

[repository]
remote = "origin"
planner_remote_exploration = true
web_url = "https://github.com/m413w4r3/AutoWork"

[github]
# Optional workstream metadata; issue content is external, untrusted context.
enabled = false
issue_mode = "off"
pull_request_mode = "off"

[publish]
enabled = false
remote = "origin"
mode = "run-branch"

[environment]
files = ["../../Bridges/.env.models"]

[codex_runtime]
home = "~/.local/share/metaharness/codex"

[claude_runtime]
home = "~/.local/share/metaharness/claude"

# EXECUTION_CLASS -> implementation profile.
# These values are frozen into run_options.json.
[routing]
mechanical_profile = "codex-luna-high"
reasoning_profile = "codex-luna-xhigh"
agentic_profile = "codex-deepseek-flash-max"

[approval]
require_plan_approval = true
poll_interval_seconds = 0.5

[ui]
max_active_runs = 1
enable_profile_recommendation = true
default_planner_profile = "planner-chatgpt"
default_reviewer_profile = "planner-chatgpt"
default_reviser_profile = "claude-opus-5-medium"
default_repair_profile = "codex-luna-high"

[context]
always_files = ["AGENTS.md"]
# "--" keeps a SPEC starting with "-" from being parsed as a ctx.py option.
locator_argv = [
    "uv",
    "run",
    "scripts/ctx/ctx.py",
    "query",
    "-k",
    "12",
    "--json",
    "--",
    "{query}"
]
locator_timeout_seconds = 180
max_hits = 12
max_bytes = 128000
require_locator_head_at_base = true

[prompt_budget]
planner_max_bytes = 192000
implementer_max_bytes = 48000
check_repair_max_bytes = 64000
semantic_revision_max_bytes = 128000
final_review_max_bytes = 128000


# Provider configuration for Codex-backed DeepSeek workers.
# MetaHarness must persist only the ENV VARIABLE NAME, never its value.

[codex_providers.deepseek]
base_url = "https://api.deepseek.com/"
wire_api = "responses"
api_key_env = "DEEPSEEK_API_KEY"


[model_profiles."planner-chatgpt"]
display_name = "ChatGPT UI Planner"
roles = ["planner", "reviewer"]
driver = "openai-chat"
provider = "openai"
model = "chatgpt-web"
selection_mode = "external-ui"
base_url = "http://127.0.0.1:8001"
endpoint_path = "/v1/chat/completions"
api_key_env = "BRIDGE_API_KEY"
timeout_seconds = 42000
retries = 2
description = "Strong semantic planning and review through the ChatGPT bridge."
strengths = ["planning", "semantic review", "risk analysis"]
cost_tier = "standard"
latency_tier = "standard"


