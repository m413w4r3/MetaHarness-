repo = "../AutoWork"
base_ref = "main"

runs_root = "../MetaHarness-runs"
worktrees_root = "../MetaHarness-worktrees"

require_clean_base = true
max_diff_bytes = 400000

[agent]
provider = "codex"
model = "gpt-5.6-luna"
effort = "high"
sandbox = "workspace-write"
timeout_seconds = 5400

[context]
always_files = ["AGENTS.md", "CLAUDE.md", "README.md"]
# "--" keeps a SPEC starting with "-" from being parsed as a ctx.py option.
locator_argv = [
    "uv",
    "run",
    "scripts/ctx/ctx.py",
    "query",
    "-k",
    "8",
    "--json",
    "--",
    "{query}"
]
locator_timeout_seconds = 180
max_hits = 8
max_bytes = 160000
require_locator_head_at_base = true

[planner]
base_url = "${META_PLANNER_BASE_URL}"
endpoint_path = "${META_PLANNER_ENDPOINT}"
model = "${META_PLANNER_MODEL}"
timeout_seconds = 300
retries = 2

[reviewer]
base_url = "${META_REVIEWER_BASE_URL}"
endpoint_path = "${META_REVIEWER_ENDPOINT}"
model = "${META_REVIEWER_MODEL}"
timeout_seconds = 420
retries = 2

[[checks]]
name = "lint"
argv = ["make", "lint"]
timeout_seconds = 1800

[[checks]]
name = "typecheck"
argv = ["make", "typecheck"]
timeout_seconds = 1800

[[checks]]
name = "test"
argv = ["make", "test"]
timeout_seconds = 5400
