# Relative paths are resolved from this file's directory (MetaHarness/examples/).
repo = "../../AutoWork"
base_ref = "main"

runs_root = "../../MetaHarness-runs"
worktrees_root = "../../MetaHarness-worktrees"
require_clean_base = true
max_diff_bytes = 2000000
allow_no_required_checks = false
default_check_ids = ["lint", "typecheck", "test"]

[planning]
protocol = "v2"
decomposition = "aggressive"
execution_mode_policy = "require-staged"
# Aggressive decomposition only (balanced adds no such limit). Mutable paths
# are counted over the distinct union WRITE_SET ∪ CREATE_SET ∪ DELETE_SET.
# single_step_max_mutable_paths bounds a READY SINGLE plan;
# staged_step_max_mutable_paths bounds every STAGED step. Both values are
# rendered into the planner request and enforced after parsing.
single_step_max_mutable_paths = 2
staged_step_max_mutable_paths = 6

# Target workflow: planner (STAGED) -> Luna steps -> Claude -> checks ->
# candidate commit C01 (parent = BASE), pushed to the run branch -> reviewer
# -> optional C02 -> candidate commit C02 (parent = C01), pushed -> reviewer.
# The final PASS publishes the exact approved candidate chain tip (no new
# commit): CAS fast-forward of local main BASE->tip -> push origin/main.
# [revision] supplies independent defaults; durable UI runs freeze semantic
# revision, check-repair attempts and review-repair cycles in run_options.json.
# AutoWork recommendation: repair_scope_policy = "auto-bounded" and
# repair_scope_max_added_paths = 4 (captured durably per run).
[revision]
enabled = true
max_check_repair_attempts = 2
max_review_repair_cycles = 1

[repository]
remote = "origin"
planner_remote_exploration = true
web_url = "https://github.com/m413w4r3/AutoWork"

[github]
# Optional workstream metadata; issue content is external, untrusted context.
enabled = false
issue_mode = "off"
pull_request_mode = "off"

[publish]
enabled = true
remote = "origin"
mode = "fast-forward-base"

[environment]
files = ["../../Bridges/.env.models"]

[codex_runtime]
home = "~/.local/share/metaharness/codex"

[claude_runtime]
home = "~/.local/share/metaharness/claude"

[approval]
require_plan_approval = true
poll_interval_seconds = 0.5

[ui]
max_active_runs = 1
enable_profile_recommendation = true
default_planner_profile = "planner-chatgpt"
default_implementer_profile = "codex-luna-high"
default_reviewer_profile = "planner-chatgpt"
default_reviser_profile = "claude-opus-medium"
default_repair_profile = "codex-luna-high"

[context]
always_files = ["AGENTS.md"]
# "--" keeps a SPEC starting with "-" from being parsed as a ctx.py option.
locator_argv = [
    "uv",
    "run",
    "scripts/ctx/ctx.py",
    "query",
    "-k",
    "8",
    "--json",
    "--",
    "{query}"
]
locator_timeout_seconds = 180
max_hits = 8
max_bytes = 160000
require_locator_head_at_base = true

[prompt_budget]
planner_max_bytes = 160000
implementer_max_bytes = 120000
check_repair_max_bytes = 40000
semantic_revision_max_bytes = 120000
final_review_max_bytes = 120000

[model_profiles."planner-chatgpt"]
display_name = "ChatGPT UI Planner"
roles = ["planner", "reviewer"]
driver = "openai-chat"
provider = "openai"
model = "chatgpt-web"
selection_mode = "external-ui"
base_url = "http://127.0.0.1:8001"
endpoint_path = "/v1/chat/completions"
api_key_env = "BRIDGE_API_KEY"
timeout_seconds = 42000
retries = 2
description = "Strong semantic planning and review through the ChatGPT bridge."
strengths = ["planning", "semantic review", "risk analysis"]
cost_tier = "standard"
latency_tier = "standard"

[model_profiles."codex-luna-high"]
display_name = "Codex Luna High"
roles = ["implementer", "repair"]
driver = "codex"
provider = "openai"
model = "gpt-5.6-luna"
effort = "high"
sandbox = "workspace-write"
selection_mode = "cli"
timeout_seconds = 54000
description = "Primary implementation profile for normal repository changes."
strengths = ["implementation", "unit tests", "repository navigation"]
cost_tier = "standard"
latency_tier = "fast"

# Future provider example (inactive until an exact configured model is chosen):
# [model_profiles."codex-deepseek-high"]
# display_name = "Codex DeepSeek High"
# roles = ["implementer", "repair"]
# driver = "codex"
# provider = "deepseek"
# model = "<configure-exact-model>"
# effort = "high"
# sandbox = "workspace-write"
# selection_mode = "cli"

[model_profiles."claude-opus-medium"]
display_name = "Claude Opus Medium RevisER"
roles = ["reviser", "repair"]
driver = "claude-code"
provider = "anthropic"
model = "opus"
effort = "medium"
permission_mode = "acceptEdits"
selection_mode = "cli"
timeout_seconds = 54000
description = "Independent semantic revision and correction after Luna."
strengths = ["semantic revision", "integration review", "corrective editing"]
cost_tier = "high"
latency_tier = "slow"

[[check_catalog]]
id = "lint"
description = "Repository lint gate."
argv = ["make", "lint"]
timeout_seconds = 18000

[[check_catalog]]
id = "typecheck"
description = "Repository type-check gate."
argv = ["make", "typecheck"]
timeout_seconds = 18000

[[check_catalog]]
id = "test"
description = "Repository unit and application test gate."
argv = ["make", "test"]
timeout_seconds = 54000

[[check_catalog]]
id = "test-integration"
description = "PostgreSQL-backed integration test gate."
argv = ["make", "test-integration"]
timeout_seconds = 54000
preflight_argv = ["docker", "info"]

[[check_catalog]]
id = "alembic-heads"
description = "Alembic migration head evidence."
cwd = "backend"
argv = ["uv", "run", "alembic", "heads"]
timeout_seconds = 300

[[workspace_setup]]
name = "frontend-dependencies"
argv = ["pnpm", "install", "--frozen-lockfile"]
cwd = "frontend"
timeout_seconds = 18000
