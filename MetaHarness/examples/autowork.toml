model = "claude-opus-5.5"
effort = "medium"
permission_mode = "acceptEdits"
selection_mode = "cli"
timeout_seconds = 54000
description = "Primary independent semantic revision profile."
strengths = ["semantic revision", "integration review", "corrective editing"]
cost_tier = "high"
latency_tier = "slow"


[[check_catalog]]
id = "lint"
description = "Repository lint gate."
argv = ["make", "lint"]
timeout_seconds = 18000

[[check_catalog]]
id = "typecheck"
description = "Repository type-check gate."
argv = ["make", "typecheck"]
timeout_seconds = 18000

[[check_catalog]]
id = "test"
description = "Repository unit and application test gate."
argv = ["make", "test"]
timeout_seconds = 54000

[[check_catalog]]
id = "test-integration"
description = "PostgreSQL-backed integration test gate."
argv = ["make", "test-integration"]
timeout_seconds = 54000
preflight_argv = ["docker", "info"]

[[check_catalog]]
id = "frontend-e2e"
description = "Frontend end-to-end acceptance gate."
cwd = "frontend"
argv = ["pnpm", "test:e2e"]
timeout_seconds = 54000

[[check_catalog]]
id = "alembic-heads"
description = "Alembic migration head evidence."
cwd = "backend"
argv = ["sh", "-c", "set -eu; out=\"$(uv run alembic heads)\"; printf '%s\\n' \"$out\"; test \"$out\" = '0001_baseline (head)'"]
timeout_seconds = 300

[[workspace_setup]]
name = "frontend-dependencies"
argv = ["pnpm", "install", "--frozen-lockfile"]
cwd = "frontend"
timeout_seconds = 18000
